name: android

# Builds an installable debug APK of the app (D-161). Not part of the normal CI: it runs by hand
# ("Run workflow") or on branches named native-*. The android/ project is generated here from
# capacitor.config.json each time and never committed.
on:
  workflow_dispatch:
  push:
    branches: ['native-*']

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm ci
      - name: Build the web app
        run: npm run build
      - name: Generate the Android project
        run: npx cap add android
      - name: Reminder permissions
        run: python3 tools/android/patch_manifest.py android/app/src/main/AndroidManifest.xml
      - name: Copy the web app into it
        run: npx cap sync android
      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: taqweem-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
