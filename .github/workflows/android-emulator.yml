name: android-emulator

# Builds the debug APK, then runs it in a real Android emulator and checks that a reminder rings (D-168).
# Builds an installable debug APK of the app (D-161). Not part of the normal CI: it runs by hand
# ("Run workflow") or on branches named native-*. The android/ project is generated here from
# capacitor.config.json each time and never committed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm ci
      - name: Build the web app
        run: npm run build
      - name: Generate the Android project
        run: npx cap add android
      - name: Reminder permissions
        run: python3 tools/android/patch_manifest.py android/app/src/main/AndroidManifest.xml
      - name: Copy the web app into it
        run: npx cap sync android
      - name: Use the fixed debug key so each build updates the last one (D-164)
        run: mkdir -p ~/.android && cp tools/android/debug.keystore ~/.android/debug.keystore
      - name: Build the debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash tools/android/emulator_test.sh android/app/build/outputs/apk/debug/app-debug.apk emulator-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-out
          path: emulator-out
